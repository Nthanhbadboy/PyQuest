version: 2.1

parameters:
  run_full_suite:
    type: boolean
    default: false

jobs:
  flutter-smoke:
    docker:
      - image: cimg/base:current
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install Flutter 3.47.7 and Linux test prerequisites
          command: |
            sudo apt-get update
            sudo apt-get install -y curl git libglu1-mesa libsqlite3-0 python3 unzip xz-utils zip
            git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$HOME/flutter"
            echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"
            flutter --version
            flutter precache --linux
      - run:
          name: Resolve Flutter dependencies
          command: |
            source "$BASH_ENV"
            cd app
            flutter pub get
      - run:
          name: Verify reproducible localization generation
          command: |
            source "$BASH_ENV"
            python3 ci/test_l10n_evidence.py
            python3 ci/l10n_evidence.py collect \
              --repo-root "$PWD" \
              --app-dir "$PWD/app" \
              --output /tmp/circleci-l10n-evidence.json \
              --sha "$CIRCLE_SHA1" \
              --run-id "$CIRCLE_BUILD_NUM"
      - run:
          name: One-test smoke check (locale resolver)
          command: |
            source "$BASH_ENV"
            mkdir -p /tmp/circleci-artifacts
            cp /tmp/circleci-l10n-evidence.json /tmp/circleci-artifacts/
            cd app
            set +e
            flutter test --reporter expanded test/l10n/locale_resolver_test.dart \
              --plain-name "resolves regional system tags in OS order and canonicalizes the match" \
              2>&1 | tee /tmp/circleci-artifacts/flutter-smoke.log
            smoke_status=${PIPESTATUS[0]}
            printf '%s\n' "$smoke_status" > /tmp/circleci-artifacts/flutter-smoke-exit.txt
            exit 0
      - store_artifacts:
          path: /tmp/circleci-artifacts
          destination: pqc-016-circleci-smoke
      - run:
          name: Fail if the smoke test failed
          command: test "$(cat /tmp/circleci-artifacts/flutter-smoke-exit.txt)" -eq 0
      - when:
          condition:
            equal: [true, << pipeline.parameters.run_full_suite >>]
          steps:
            - run:
                name: Analyze, ordinary tests, and render tests
                no_output_timeout: 60m
                command: |
                  source "$BASH_ENV"
                  set +e
                  cd app

                  flutter analyze --no-fatal-infos 2>&1 | tee /tmp/flutter-analyze.log
                  analyze_status=${PIPESTATUS[0]}

                  flutter test --reporter expanded --exclude-tags render 2>&1 | tee /tmp/flutter-test.log
                  test_status=${PIPESTATUS[0]}

                  flutter test --reporter expanded --tags render test/render 2>&1 | tee /tmp/flutter-render.log
                  render_status=${PIPESTATUS[0]}

                  printf '\nCircleCI phase results: analyze=%s test=%s render=%s\n' \
                    "$analyze_status" "$test_status" "$render_status"
                  if [ "$analyze_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$render_status" -ne 0 ]; then
                    exit 1
                  fi

workflows:
  pqc-016-circleci-tests:
    jobs:
      - flutter-smoke:
          filters:
            branches:
              only: arena/0d4fcb38-pyquest
