  <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7862B6"/><stop offset="1" stop-color="#2E376E"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFEBA1"/><stop offset=".45" stop-color="#FFC84A"/><stop offset="1" stop-color="#F28B36"/></linearGradient>
