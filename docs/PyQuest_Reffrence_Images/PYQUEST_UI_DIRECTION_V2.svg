  <filter id="glow"><feGaussianBlur stdDeviation="9"/></filter>
  <pattern id="stars" width="94" height="88" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r="1.8" fill="#D9F8FF" opacity=".7"/><circle cx="68" cy="56" r="1.3" fill="#FBD77B" opacity=".8"/><path d="M43 7v8m-4-4h8" stroke="#C9F7FF" stroke-width="1.5" opacity=".6"/></pattern>
  <g id="tree"><path d="M0 0v20" stroke="#7B512F" stroke-width="6" stroke-linecap="round"/><circle cx="-3" cy="-7" r="13" fill="#249B87"/><circle cx="7" cy="-13" r="12" fill="#58C986"/><circle cx="-10" cy="-16" r="9" fill="#8BDD87"/></g>
