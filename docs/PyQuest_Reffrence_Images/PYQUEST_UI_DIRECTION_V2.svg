<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">PyQuest UI Direction V2 — Adventure, Code, Rewards</title>
<desc id="desc">A polished UI direction board inspired by the existing PyQuest reference images: a floating-island world map, a focused coding mission, and a celebratory results screen. Bright game-art illustration is paired with more mature interface hierarchy.</desc>
<defs>
