name: pyquest
description: "PyQuest — Build Your Game. Rule Your World. A game world for kids with mini-games and a Python learning quest."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  sqflite_common_ffi: ^2.3.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
