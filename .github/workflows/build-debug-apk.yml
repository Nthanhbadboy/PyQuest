name: Build PyQuest APK (keyless preview)

on:
  push:
    branches:
      - debug/remove-ai-transcript-add-voice-logs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      # Keyless preview policy r47: never compile a provider secret into CI artifacts.
      - name: Build debug APK (keyless preview)
        run: flutter build apk --debug --dart-define=GEMINI_API_KEY=

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pyquest-debug-keyless-preview
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
