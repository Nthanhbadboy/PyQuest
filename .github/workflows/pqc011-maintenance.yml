name: PQC-011 pinned SDK maintenance

on:
  push:
    branches:
      - arena/0d4fcb38-pyquest
  workflow_dispatch:
    inputs:
      phase:
        description: Normalize the bounded allowlist, then dispatch verify on the resulting branch tip
        required: true
        type: choice
        options:
          - normalize
          - verify
        default: normalize

permissions:
  contents: write
  checks: write

concurrency:
  group: pqc011-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintenance:
    name: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[pqc011-diag]') && 'PQC-011 diagnostic-only') || 'maintenance' }}
    if: >-
      github.ref == 'refs/heads/arena/0d4fcb38-pyquest' &&
      (github.event_name == 'workflow_dispatch' ||
       (contains(github.event.head_commit.message, '[pqc011-diag]') &&
        !contains(github.event.head_commit.message, '[pqc011-normalize]') &&
        !contains(github.event.head_commit.message, '[pqc011-verify]') &&
        !contains(github.event.head_commit.message, '[apk]') &&
        !contains(github.event.head_commit.message, '[emulator]') &&
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]')) ||
       (!contains(github.event.head_commit.message, '[pqc011-diag]') &&
        (contains(github.event.head_commit.message, '[pqc011-normalize]') ||
         contains(github.event.head_commit.message, '[pqc011-verify]'))))
    env:
      MAINTENANCE_PHASE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[pqc011-diag]') && 'diagnose') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pqc011-normalize]') && 'normalize') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pqc011-verify]') && 'verify') || inputs.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact CODE source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Verify source and SDK pins
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - "$RUNNER_TEMP/flutter-version.json" <<'PY'
          import json, sys
          info = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = {
              'frameworkVersion': '3.47.7',
              'dartSdkVersion': '3.13.5',
              'frameworkRevision': 'abaf9c523780a608bd46686fd5e53740a07077f8',
          }
          actual = {key: info.get(key) for key in expected}
          print(json.dumps(actual, indent=2))
          if actual != expected:
              raise SystemExit(f'Pinned SDK mismatch: expected {expected!r}')
          PY

      - name: Validate diagnostic commit scope
        if: env.MAINTENANCE_PHASE == 'diagnose'
        id: diagnostic_scope
        env:
          EXPECTED_REF: refs/heads/arena/0d4fcb38-pyquest
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          allowed = {
              '.github/workflows/ci.yml',
              '.github/workflows/pqc011-maintenance.yml',
              'app/test/lesson_board_integration_test.dart',
              'docs/implementation/coordination/tasks/PQC-011.md',
          }
          before = os.environ['PUSH_BEFORE']
          after = os.environ['PUSH_AFTER']
          message = os.environ['HEAD_MESSAGE']
          problems = []
          if os.environ['GITHUB_REF'] != os.environ['EXPECTED_REF']:
              problems.append('push is not on the exact CODE branch')
          if message.count('[pqc011-diag]') != 1:
              problems.append('commit must contain exactly one [pqc011-diag] marker')
          mixed = [
              marker for marker in (
                  '[pqc011-verify]', '[pqc011-normalize]', '[apk]', '[emulator]',
                  '[skip ci]', '[ci skip]',
              ) if marker in message
          ]
          if mixed:
              problems.append(f'forbidden mixed marker(s): {", ".join(mixed)}')
          commit_count = int(subprocess.check_output(
              ['git', 'rev-list', '--count', f'{before}..{after}'], text=True
          ).strip())
          if commit_count != 1:
              problems.append(f'expected one pushed commit, found {commit_count}')
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '--no-renames', before, after], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if not changed:
              problems.append('push contains no changed files')
          if unexpected:
              problems.append(f'out-of-scope changed paths: {", ".join(unexpected)}')
          print(f'Pushed commit count: {commit_count}; changed paths: {sorted(changed)}')
          if problems:
              for problem in problems:
                  print(f'REJECTED: {problem}')
              sys.exit(1)
          print('Diagnostic marker and exact four-file scope validated.')
          PY

      - name: Resolve dependencies for diagnostic-only tests
        if: env.MAINTENANCE_PHASE == 'diagnose' && steps.diagnostic_scope.outcome == 'success'
        id: diagnostic_pub_get
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pqc011-diagnostic-pub-get.log"
          git diff --exit-code -- pubspec.lock

      - name: Isolated tutor-state diagnostic
        if: env.MAINTENANCE_PHASE == 'diagnose' && steps.diagnostic_scope.outcome == 'success' && steps.diagnostic_pub_get.outcome == 'success'
        id: diagnostic_isolated
        continue-on-error: true
        timeout-minutes: 3
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --timeout 45s \
            --plain-name 'tutor sheet and locale changes preserve the lesson-owned board/editor state' \
            test/lesson_board_integration_test.dart \
            2>&1 | tee "$RUNNER_TEMP/pqc011-diagnostic-isolated.log"

      - name: First-test then tutor-state diagnostic
        if: env.MAINTENANCE_PHASE == 'diagnose' && steps.diagnostic_scope.outcome == 'success' && steps.diagnostic_pub_get.outcome == 'success'
        id: diagnostic_sequence
        continue-on-error: true
        timeout-minutes: 3
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --timeout 45s \
            --name 'authored example editor/run and board controls do not grade or progress|tutor sheet and locale changes preserve the lesson-owned board/editor state' \
            test/lesson_board_integration_test.dart \
            2>&1 | tee "$RUNNER_TEMP/pqc011-diagnostic-sequence.log"

      - name: Summarize PQC-011 diagnostic-only results
        if: ${{ always() && env.MAINTENANCE_PHASE == 'diagnose' }}
        id: diagnostic_summary
        env:
          SOURCE_SHA: ${{ github.sha }}
          SCOPE_OUTCOME: ${{ steps.diagnostic_scope.outcome }}
          PUB_GET_OUTCOME: ${{ steps.diagnostic_pub_get.outcome }}
          ISOLATED_OUTCOME: ${{ steps.diagnostic_isolated.outcome }}
          SEQUENCE_OUTCOME: ${{ steps.diagnostic_sequence.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          temp = Path(os.environ['RUNNER_TEMP'])
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])

          def result(label, filename, expected, outcome):
              if outcome == 'skipped':
                  return f'{label}: NOT_RUN (diagnostic scope or dependency prerequisite failed/skipped)'
              path = temp / filename
              if not path.exists():
                  return f'{label}: FAIL (test log/count unavailable)'
              text = path.read_text(encoding='utf-8', errors='replace')
              matches = re.findall(
                  r'\+(\d+)(?:\s+-(\d+))?:\s*(All tests passed!|Some tests failed\.)',
                  text,
              )
              if not matches:
                  return f'{label}: FAIL (summary/count unavailable)'
              passed_text, failed_text, marker = matches[-1]
              passed, failed = int(passed_text), int(failed_text or 0)
              total = passed + failed
              ok = outcome == 'success' and marker == 'All tests passed!' and failed == 0 and passed == expected
              status = 'PASS' if ok else 'FAIL'
              return f'{label}: {status} — {passed} passed, {failed} failed ({total} total); expected {expected} passing tests'

          isolated = result(
              'Isolated tutor-state test',
              'pqc011-diagnostic-isolated.log',
              1,
              os.environ['ISOLATED_OUTCOME'],
          )
          sequence = result(
              'First-test → tutor-state sequence',
              'pqc011-diagnostic-sequence.log',
              2,
              os.environ['SEQUENCE_OUTCOME'],
          )
          dirty = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              text=True,
          ).strip()
          clean_result = 'PASS' if not dirty else 'FAIL (working tree changed; no auto-commit/push performed)'
          pub_result = os.environ['PUB_GET_OUTCOME'].upper()
          overall = (
              os.environ['SCOPE_OUTCOME'] == 'success'
              and os.environ['PUB_GET_OUTCOME'] == 'success'
              and isolated.startswith('Isolated tutor-state test: PASS')
              and sequence.startswith('First-test → tutor-state sequence: PASS')
              and not dirty
          )
          conclusion = 'PASS' if overall else 'FAIL'
          lines = [
              '# PQC-011 diagnostic-only',
              '',
              f'- Source SHA: `{os.environ["SOURCE_SHA"]}`',
              '- SDK: Flutter 3.47.7 / Dart 3.13.5 / framework `abaf9c523780a608bd46686fd5e53740a07077f8` (pin verified before tests)',
              f'- Diagnostic commit scope: {os.environ["SCOPE_OUTCOME"].upper()}',
              f'- `flutter pub get` / lock unchanged: {pub_result}',
              f'- {isolated}',
              f'- {sequence}',
              f'- Source cleanliness: {clean_result}',
              f'- Diagnostic result: **{conclusion}**; this check is diagnostic evidence only and does not accept PQC-011.',
              '',
          ]
          for label, filename in (
              ('Isolated trace and failure excerpt', 'pqc011-diagnostic-isolated.log'),
              ('Ordered sequence trace and failure excerpt', 'pqc011-diagnostic-sequence.log'),
          ):
              path = temp / filename
              lines.extend([f'## {label}', '```text'])
              if not path.exists():
                  lines.append('NOT_RUN: no test log was produced.')
              else:
                  text = path.read_text(encoding='utf-8', errors='replace')
                  trace = [line for line in text.splitlines() if '[PQC-011' in line]
                  tail = '\n'.join(text.splitlines()[-80:])
                  excerpt = '\n'.join(trace[-100:]) + '\n--- test output tail ---\n' + tail
                  lines.append(excerpt[-12000:])
              lines.extend(['```', ''])
          summary.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines[:12]))
          if not overall:
              sys.exit(1)
          PY

      - name: Upload PQC-011 diagnostic-only logs
        if: ${{ always() && env.MAINTENANCE_PHASE == 'diagnose' }}
        uses: actions/upload-artifact@v4
        with:
          name: pqc011-diagnostic-only-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pqc011-diagnostic-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Normalize the authorized 13 Dart files and pub lock
        if: env.MAINTENANCE_PHASE == 'normalize'
        env:
          BASE_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          test "$remote_sha" = "$BASE_SHA" || {
            echo "Remote moved: expected $BASE_SHA, found $remote_sha" >&2
            exit 1
          }

          cd app
          flutter pub get
          lock_after_first="$(sha256sum pubspec.lock | cut -d' ' -f1)"
          flutter pub get
          lock_after_second="$(sha256sum pubspec.lock | cut -d' ' -f1)"
          test "$lock_after_first" = "$lock_after_second" || {
            echo 'pub get changed pubspec.lock on its second run' >&2
            exit 1
          }
          dart format \
            lib/modules/main_quest/lesson_screen.dart \
            lib/modules/tutor/board/authored_board_repository.dart \
            lib/modules/tutor/board/board_view.dart \
            test/lesson_board_integration_test.dart \
            test/board/authored_board_repository_test.dart \
            test/board/board_boundaries_test.dart \
            test/board/board_controller_test.dart \
            test/board/board_layout_test.dart \
            test/board/board_plan_codec_test.dart \
            test/board/board_previews_test.dart \
            test/board/board_test_support.dart \
            test/board/board_view_test.dart \
            test/tutor_board_content_pack_test.dart
          cd ..

          python3 - <<'PY'
          import subprocess, sys
          allowed = {
              'app/pubspec.lock',
              'app/lib/modules/main_quest/lesson_screen.dart',
              'app/lib/modules/tutor/board/authored_board_repository.dart',
              'app/lib/modules/tutor/board/board_view.dart',
              'app/test/lesson_board_integration_test.dart',
              'app/test/board/authored_board_repository_test.dart',
              'app/test/board/board_boundaries_test.dart',
              'app/test/board/board_controller_test.dart',
              'app/test/board/board_layout_test.dart',
              'app/test/board/board_plan_codec_test.dart',
              'app/test/board/board_previews_test.dart',
              'app/test/board/board_test_support.dart',
              'app/test/board/board_view_test.dart',
              'app/test/tutor_board_content_pack_test.dart',
          }
          records = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all', '--no-renames']
          ).decode('utf-8').splitlines()
          changed = {record[3:] for record in records if record}
          unexpected = sorted(changed - allowed)
          if unexpected:
              print('Refusing to stage paths outside PQC-011 r49 allowlist:', file=sys.stderr)
              print('\n'.join(unexpected), file=sys.stderr)
              raise SystemExit(1)
          PY
          git diff --check
          git add -- \
            app/pubspec.lock \
            app/lib/modules/main_quest/lesson_screen.dart \
            app/lib/modules/tutor/board/authored_board_repository.dart \
            app/lib/modules/tutor/board/board_view.dart \
            app/test/lesson_board_integration_test.dart \
            app/test/board/authored_board_repository_test.dart \
            app/test/board/board_boundaries_test.dart \
            app/test/board/board_controller_test.dart \
            app/test/board/board_layout_test.dart \
            app/test/board/board_plan_codec_test.dart \
            app/test/board/board_previews_test.dart \
            app/test/board/board_test_support.dart \
            app/test/board/board_view_test.dart \
            app/test/tutor_board_content_pack_test.dart
          python3 - <<'PY'
          import subprocess, sys
          allowed = {
              'app/pubspec.lock',
              'app/lib/modules/main_quest/lesson_screen.dart',
              'app/lib/modules/tutor/board/authored_board_repository.dart',
              'app/lib/modules/tutor/board/board_view.dart',
              'app/test/lesson_board_integration_test.dart',
              'app/test/board/authored_board_repository_test.dart',
              'app/test/board/board_boundaries_test.dart',
              'app/test/board/board_controller_test.dart',
              'app/test/board/board_layout_test.dart',
              'app/test/board/board_plan_codec_test.dart',
              'app/test/board/board_previews_test.dart',
              'app/test/board/board_test_support.dart',
              'app/test/board/board_view_test.dart',
              'app/test/tutor_board_content_pack_test.dart',
          }
          staged = set(subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(staged - allowed)
          if unexpected:
              print('Refusing staged paths outside PQC-011 r49 allowlist:', file=sys.stderr)
              print('\n'.join(unexpected), file=sys.stderr)
              raise SystemExit(1)
          print(f'Allowlisted staged paths: {len(staged)}')
          PY

          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'maintenance: normalize PQC-011 r49 allowlist [pqc011-verify]'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          final_sha="$(git rev-parse HEAD)"
          printf 'normalized_sha=%s\n' "$final_sha" >> "$GITHUB_OUTPUT"
          {
            echo '### PQC-011 normalization'
            echo "Source started at: \\`$BASE_SHA\\`"
            echo "Normalized CODE SHA: \\`$final_sha\\`"
            echo 'This phase only formats the 13 ordered Dart files and resolves the existing pub lock; the [pqc011-verify] push starts verification on the normalized SHA.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm verification is attached to current branch tip
        if: env.MAINTENANCE_PHASE == 'verify'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo "Verified source SHA: $EXPECTED_SHA"

      - name: Check pub get reproducibility
        if: env.MAINTENANCE_PHASE == 'verify'
        id: pub_get
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pqc011-pub-get.log"
          git diff --exit-code -- pubspec.lock

      - name: Check formatting on the 13-file allowlist
        if: env.MAINTENANCE_PHASE == 'verify'
        id: format
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib/modules/main_quest/lesson_screen.dart \
            lib/modules/tutor/board/authored_board_repository.dart \
            lib/modules/tutor/board/board_view.dart \
            test/lesson_board_integration_test.dart \
            test/board/authored_board_repository_test.dart \
            test/board/board_boundaries_test.dart \
            test/board/board_controller_test.dart \
            test/board/board_layout_test.dart \
            test/board/board_plan_codec_test.dart \
            test/board/board_previews_test.dart \
            test/board/board_test_support.dart \
            test/board/board_view_test.dart \
            test/tutor_board_content_pack_test.dart 2>&1 | tee "$RUNNER_TEMP/pqc011-format.log"

      - name: Localization evidence helper tests
        if: env.MAINTENANCE_PHASE == 'verify'
        id: l10n_tests
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 ci/test_l10n_evidence.py 2>&1 | tee "$RUNNER_TEMP/pqc011-l10n-tests.log"

      - name: Collect generated localization evidence
        if: env.MAINTENANCE_PHASE == 'verify'
        id: l10n_collect
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          python3 ../ci/l10n_evidence.py collect --repo-root .. --app-dir . \
            --output "$RUNNER_TEMP/pqc011-l10n-evidence.json" \
            2>&1 | tee "$RUNNER_TEMP/pqc011-l10n-collect.log"

      - name: Analyze
        if: env.MAINTENANCE_PHASE == 'verify'
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/pqc011-analyze.log"

      - name: Reproduce tutor-state test in isolation
        if: env.MAINTENANCE_PHASE == 'verify'
        id: integration_isolated
        continue-on-error: true
        timeout-minutes: 3
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --timeout 45s \
            --plain-name 'tutor sheet and locale changes preserve the lesson-owned board/editor state' \
            test/lesson_board_integration_test.dart 2>&1 | tee "$RUNNER_TEMP/pqc011-integration-isolated.log"

      - name: Reproduce first-test then tutor-state sequence
        if: env.MAINTENANCE_PHASE == 'verify'
        id: integration_sequence
        continue-on-error: true
        timeout-minutes: 3
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --timeout 45s \
            --name 'authored example editor/run and board controls do not grade or progress|tutor sheet and locale changes preserve the lesson-owned board/editor state' \
            test/lesson_board_integration_test.dart 2>&1 | tee "$RUNNER_TEMP/pqc011-integration-sequence.log"

      - name: Lesson board integration tests
        if: env.MAINTENANCE_PHASE == 'verify'
        id: integration
        continue-on-error: true
        timeout-minutes: 10
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --timeout 45s test/lesson_board_integration_test.dart 2>&1 | tee "$RUNNER_TEMP/pqc011-integration.log"


      - name: Focused Settings tests
        if: env.MAINTENANCE_PHASE == 'verify'
        id: settings
        continue-on-error: true
        timeout-minutes: 5
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --timeout 45s test/l10n/settings_sheet_localization_test.dart 2>&1 | tee "$RUNNER_TEMP/pqc011-settings.log"

      - name: Ordinary Flutter suite
        if: env.MAINTENANCE_PHASE == 'verify'
        id: ordinary
        continue-on-error: true
        timeout-minutes: 20
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --exclude-tags render 2>&1 | tee "$RUNNER_TEMP/pqc011-ordinary.log"

      - name: Render suite
        if: env.MAINTENANCE_PHASE == 'verify'
        id: render
        continue-on-error: true
        timeout-minutes: 10
        working-directory: app
        run: |
          set -euo pipefail
          flutter test --reporter expanded --tags render test/render 2>&1 | tee "$RUNNER_TEMP/pqc011-render.log"

      - name: Publish localization evidence
        if: ${{ always() && env.MAINTENANCE_PHASE == 'verify' && steps.l10n_collect.outcome == 'success' }}
        id: l10n_publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 ci/l10n_evidence.py publish --evidence "$RUNNER_TEMP/pqc011-l10n-evidence.json" 2>&1 | tee "$RUNNER_TEMP/pqc011-l10n-publish.log"

      - name: Verify final source cleanliness
        if: env.MAINTENANCE_PHASE == 'verify'
        id: clean
        continue-on-error: true
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Upload pinned SDK logs
        if: ${{ always() && env.MAINTENANCE_PHASE == 'verify' }}
        uses: actions/upload-artifact@v4
        with:
          name: pqc011-r49-${{ github.sha }}-diagnostics
          path: |
            ${{ runner.temp }}/pqc011-*.log
            ${{ runner.temp }}/pqc011-l10n-evidence.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish exact gate counts and failure excerpts to Checks API
        if: ${{ always() && env.MAINTENANCE_PHASE == 'verify' }}
        id: gate_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          PUB_GET: ${{ steps.pub_get.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          L10N_TESTS: ${{ steps.l10n_tests.outcome }}
          L10N_COLLECT: ${{ steps.l10n_collect.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          SETTINGS: ${{ steps.settings.outcome }}
          INTEGRATION_ISOLATED: ${{ steps.integration_isolated.outcome }}
          INTEGRATION_SEQUENCE: ${{ steps.integration_sequence.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          ORDINARY: ${{ steps.ordinary.outcome }}
          RENDER: ${{ steps.render.outcome }}
          L10N_PUBLISH: ${{ steps.l10n_publish.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import Request, urlopen

          temp = Path(os.environ['RUNNER_TEMP'])
          gates = {
              'pub get / lock reproducibility': os.environ['PUB_GET'],
              'formatter': os.environ['FORMAT'],
              'localization helper tests': os.environ['L10N_TESTS'],
              'localization evidence collection': os.environ['L10N_COLLECT'],
              'analyze': os.environ['ANALYZE'],
              'Settings': os.environ['SETTINGS'],
              'isolated tutor-state test': os.environ['INTEGRATION_ISOLATED'],
              'first-test then tutor-state sequence': os.environ['INTEGRATION_SEQUENCE'],
              'lesson-board integration': os.environ['INTEGRATION'],
              'ordinary suite': os.environ['ORDINARY'],
              'render suite': os.environ['RENDER'],
              'localization evidence publication': os.environ['L10N_PUBLISH'],
              'source cleanliness': os.environ['CLEAN'],
          }

          def test_count(filename, required, *, minimum=False):
              path = temp / filename
              if not path.exists():
                  return 'FAIL: count unavailable (log missing)'
              text = path.read_text(encoding='utf-8', errors='replace')
              matches = re.findall(
                  r'\+(\d+)(?:\s+-(\d+))?:\s*(All tests passed!|Some tests failed\.)',
                  text,
              )
              if not matches:
                  return 'FAIL: count unavailable (summary missing)'
              passed_text, failed_text, marker = matches[-1]
              passed = int(passed_text)
              failed = int(failed_text or 0)
              total = passed + failed
              count_ok = passed >= required if minimum else passed == required
              ok = marker == 'All tests passed!' and failed == 0 and count_ok
              requirement = f'at least {required}' if minimum else f'exactly {required}'
              result = 'PASS' if ok else 'FAIL'
              return (
                  f'{result}: {passed} passed, {failed} failed ({total} total); '
                  f'required {requirement} passed and zero failures'
              )

          def excerpt(filename, limit=16000):
              path = temp / filename
              if not path.exists():
                  return '(log unavailable)'
              text = path.read_text(encoding='utf-8', errors='replace')
              return text[-limit:]

          test_results = {
              'Settings': test_count('pqc011-settings.log', 12),
              'Isolated tutor-state test': test_count(
                  'pqc011-integration-isolated.log', 1
              ),
              'First-test then tutor-state sequence': test_count(
                  'pqc011-integration-sequence.log', 2
              ),
              'Lesson-board integration': test_count('pqc011-integration.log', 7),
              'Ordinary suite': test_count(
                  'pqc011-ordinary.log', 422, minimum=True
              ),
              'Render suite': test_count('pqc011-render.log', 10),
          }
          summary_rows = [
              ('Pinned SDK', 'Flutter 3.47.7 / Dart 3.13.5 / framework abaf9c523780a608bd46686fd5e53740a07077f8'),
              ('Settings', f"{gates['Settings']}; {test_results['Settings']}"),
              ('Isolated tutor-state test', f"{gates['isolated tutor-state test']}; {test_results['Isolated tutor-state test']}"),
              ('First-test then tutor-state sequence', f"{gates['first-test then tutor-state sequence']}; {test_results['First-test then tutor-state sequence']}"),
              ('Lesson-board integration', f"{gates['lesson-board integration']}; {test_results['Lesson-board integration']}"),
              ('Ordinary suite', f"{gates['ordinary suite']}; {test_results['Ordinary suite']}"),
              ('Render suite', f"{gates['render suite']}; {test_results['Render suite']}"),
              ('Localization helper tests', gates['localization helper tests']),
              ('Localization evidence collection', gates['localization evidence collection']),
              ('Analyze', gates['analyze']),
              ('Formatter', gates['formatter']),
              ('pub get / lock reproducibility', gates['pub get / lock reproducibility']),
              ('Source cleanliness', gates['source cleanliness']),
          ]
          markdown = ['| Gate | Result |', '|---|---|']
          markdown.extend(f'| {name} | {value} |' for name, value in summary_rows)
          failures = [name for name, value in gates.items() if value != 'success']
          failures.extend(
              f'{name} test output: {result}'
              for name, result in test_results.items()
              if not result.startswith('PASS:')
          )
          conclusion = 'failure' if failures else 'success'
          text = '\n'.join([
              '### Failing gate outcomes',
              ', '.join(failures) if failures else 'None',
              '',
              '### Isolated tutor-state reproduction log tail',
              '```text',
              excerpt('pqc011-integration-isolated.log'),
              '```',
              '',
              '### First-test then tutor-state sequence log tail',
              '```text',
              excerpt('pqc011-integration-sequence.log'),
              '```',
              '',
              '### Full integration log tail',
              '```text',
              excerpt('pqc011-integration.log'),
              '```',
              '',
              '### Ordinary suite log tail',
              '```text',
              excerpt('pqc011-ordinary.log'),
              '```',
          ])
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload = {
              'name': 'PQC-011 r49 exact gate counts',
              'head_sha': os.environ['SOURCE_SHA'],
              'external_id': f"{os.environ['RUN_ID']}-{os.environ['RUN_ATTEMPT']}",
              'details_url': f"https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['RUN_ID']}",
              'status': 'completed',
              'conclusion': conclusion,
              'started_at': now,
              'completed_at': now,
              'output': {
                  'title': f"PQC-011 r49 pinned SDK gates: {conclusion.upper()}",
                  'summary': '\n'.join(markdown),
                  'text': text,
              },
          }
          request = Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          url = result.get('html_url', '')
          print(f"Published exact gate counts for {os.environ['SOURCE_SHA']}: {url}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'evidence_url={url}\n')
              output.write(f'evidence_conclusion={conclusion}\n')
          PY

      - name: Summarize verification result
        if: ${{ always() && env.MAINTENANCE_PHASE == 'verify' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
          PUB_GET: ${{ steps.pub_get.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          L10N_TESTS: ${{ steps.l10n_tests.outcome }}
          L10N_COLLECT: ${{ steps.l10n_collect.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          SETTINGS: ${{ steps.settings.outcome }}
          INTEGRATION_ISOLATED: ${{ steps.integration_isolated.outcome }}
          INTEGRATION_SEQUENCE: ${{ steps.integration_sequence.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          ORDINARY: ${{ steps.ordinary.outcome }}
          RENDER: ${{ steps.render.outcome }}
          L10N_PUBLISH: ${{ steps.l10n_publish.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
          GATE_EVIDENCE: ${{ steps.gate_evidence.outputs.evidence_url }}
          GATE_CONCLUSION: ${{ steps.gate_evidence.outputs.evidence_conclusion }}
        run: |
          set -u
          {
            echo '### PQC-011 r49 pinned SDK verification'
            echo "Exact test-count check: $GATE_EVIDENCE"
            echo "Source SHA: \\`$SOURCE_SHA\\`"
            echo '| Gate | Outcome |'
            echo '|---|---|'
            echo "| pub get / lock reproducibility | $PUB_GET |"
            echo "| formatter | $FORMAT |"
            echo "| localization helper tests | $L10N_TESTS |"
            echo "| localization evidence collection | $L10N_COLLECT |"
            echo "| analyze | $ANALYZE |"
            echo "| Settings | $SETTINGS |"
            echo "| isolated tutor-state reproduction | $INTEGRATION_ISOLATED |"
            echo "| first-test then tutor-state sequence | $INTEGRATION_SEQUENCE |"
            echo "| lesson-board integration | $INTEGRATION |"
            echo "| ordinary suite | $ORDINARY |"
            echo "| render suite | $RENDER |"
            echo "| localization evidence publication | $L10N_PUBLISH |"
            echo "| source cleanliness | $CLEAN |"
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$PUB_GET" "$FORMAT" "$L10N_TESTS" "$L10N_COLLECT" \
            "$ANALYZE" "$SETTINGS" "$INTEGRATION_ISOLATED" "$INTEGRATION_SEQUENCE" \
            "$INTEGRATION" "$ORDINARY" "$RENDER" "$CLEAN" "$GATE_CONCLUSION"; do
            if [[ "$outcome" != success ]]; then exit 1; fi
          done
