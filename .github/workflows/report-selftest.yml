name: Report selftest (temporary)

# TEMPORARY - delete once confirmed. This proves on a real runner that the
# outcome values the android job passes to the reporters behave as required:
#
#   job `failure_case`  a genuinely failed step (no continue-on-error, so
#                       steps.<id>.outcome == failure) plus a required step that
#                       GitHub really reports as `skipped`
#                       -> the check run must be a failure, and it must name
#                          both the failed step and the skipped required step;
#   job `pass_case`     every step passed except one best-effort step that
#                       GitHub really reports as `skipped` and that is declared
#                       with --optional-step
#                       -> the check run must stay a success.
#
# The conclusions are read from the two check runs this workflow publishes; the
# report texts are printed to the job log as well. Nothing here starts an
# emulator, installs an SDK or touches the real android job.
#
# It runs only when this file itself changes, and the deliberate failure in
# `failure_case` is the point of the job - that job is expected to be red.

on:
  push:
    branches:
      - 'arena/**'
      - 'docs/deep-culi-split'
    paths:
      - '.github/workflows/report-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  failure_case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - name: Fixture for the "emulator action died before the script" shape
        id: harmless_failure
        run: |
          set -u
          root=selftest/no-output
          mkdir -p "$root"
          # Exactly what run 38794903944 left behind: the build step wrote its
          # key, the journey script wrote nothing at all.
          printf 'build_apk_debug=0\n' > "$root/status.txt"
          : > "$root/journey.txt"
          : > "$root/relaunch.txt"
          echo "== deliberate harmless failure: this step is expected to fail =="
          exit 1

      - name: Required step after a failure (GitHub reports it as skipped)
        id: skipped_required
        if: success()
        run: echo "this step only runs when everything before it succeeded"

      - name: Report to step summary
        if: always()
        run: |
          # --out is relative to --repo-root, exactly like the android job
          python3 ci/job_summary.py --repo-root selftest/no-output \
            --out emulator-report.md \
            --step "Checkout=${{ steps.checkout.outcome }}" \
            --step "Fixture for the emulator-action failure shape=${{ steps.harmless_failure.outcome }}" \
            --step "Required step after a failure=${{ steps.skipped_required.outcome }}" \
            --upload-outcome success --artifact-name selftest
          test -s selftest/no-output/emulator-report.md
          echo "step summary for this step: $(wc -c < "$GITHUB_STEP_SUMMARY") bytes"
          cat selftest/no-output/emulator-report.md

      - name: Publish report as a check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/report.py "PyQuest report selftest (failure case)" \
            selftest/no-output/status.txt selftest/no-output/emulator-report.md \
            --step "Checkout=${{ steps.checkout.outcome }}" \
            --step "Fixture for the emulator-action failure shape=${{ steps.harmless_failure.outcome }}" \
            --step "Required step after a failure=${{ steps.skipped_required.outcome }}"

  pass_case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - name: Benign step (writes a healthy status file)
        id: benign
        run: |
          set -u
          root=selftest/all-ok
          mkdir -p "$root"
          printf 'build_apk_debug=0\ndevice_ready_journey=0\njourney=0\n' > "$root/status.txt"
          printf '00:12 +3: 04 dragon jump run\n' > "$root/journey.txt"

      # A condition that is genuinely false on this event, so GitHub really
      # reports outcome=skipped while every other step in the job succeeds -
      # which is the combination the optional-step rule has to allow.
      - name: Best-effort step (GitHub reports it as skipped)
        id: optional_step
        if: github.event_name == 'workflow_dispatch'
        run: echo "this best-effort step only runs when the workflow is dispatched"

      - name: Report to step summary
        if: always()
        run: |
          # --out is relative to --repo-root, exactly like the android job
          python3 ci/job_summary.py --repo-root selftest/all-ok \
            --out emulator-report.md \
            --step "Checkout=${{ steps.checkout.outcome }}" \
            --step "Benign step=${{ steps.benign.outcome }}" \
            --step "Best-effort step=${{ steps.optional_step.outcome }}" \
            --optional-step "Best-effort step" \
            --upload-outcome success --artifact-name selftest
          test -s selftest/all-ok/emulator-report.md
          echo "step summary for this step: $(wc -c < "$GITHUB_STEP_SUMMARY") bytes"
          cat selftest/all-ok/emulator-report.md

      - name: Publish report as a check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/report.py "PyQuest report selftest (optional skip)" \
            selftest/all-ok/status.txt selftest/all-ok/emulator-report.md \
            --step "Checkout=${{ steps.checkout.outcome }}" \
            --step "Benign step=${{ steps.benign.outcome }}" \
            --step "Best-effort step=${{ steps.optional_step.outcome }}" \
            --optional-step "Best-effort step"
